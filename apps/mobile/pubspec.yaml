name: studyzhouse_mobile
description: STUDYZHOUSE student mobile app (Flutter).
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.1
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#151F35"
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter_native_splash:
  color: "#151F35"
  image: assets/branding/app_icon.png
  android_12:
    color: "#151F35"
    image: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/studyhouse_logo.png
