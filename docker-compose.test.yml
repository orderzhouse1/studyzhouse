# Postgres محلي لاختبارات التكامل فقط — لا تستخدمه للإنتاج.
# تشغيل: pnpm db:test:up
# إيقاف: pnpm db:test:down

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: studyhouse-postgres-test
    environment:
      POSTGRES_USER: studyhouse
      POSTGRES_PASSWORD: studyhouse_test
      POSTGRES_DB: studyhouse_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhouse -d studyhouse_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
